<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/profile.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="#9b59b6" stroke-width="1.5" fill="none"/>
                <path d="M12 8v4l3 3" stroke="#9b59b6" stroke-width="1.5" fill="none"/>
            </svg>
            Quiz App
        </div>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <div id="statsButton" style="display: none;">
                <button class="icon-btn" onclick="goToHistory()">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 8v4l3 3" stroke="#666" stroke-width="1.5" fill="none"/>
                        <circle cx="12" cy="12" r="10" stroke="#666" stroke-width="1.5" fill="none"/>
                        <polyline points="12 8 12 12 15 15" stroke="#666" stroke-width="1.5" fill="none"/>
                    </svg>
                </button>
            </div>
            <button class="icon-btn" onclick="goBack()">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H5a2 2 0 0 1-2-2z" stroke="#666" stroke-width="1.5" fill="none"/>
                </svg>
            </button>
            <button class="icon-btn" onclick="showLogoutConfirm()">
                <svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="container">
        <div class="profile-container">
            <h1>⚙️ Настройки профиля</h1>
            <div id="successMsg" class="success"></div>
            <div id="errorMsg" class="error"></div>

            <h3 class="section-title">Основная информация</h3>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="displayName">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>
            <button class="btn-primary" onclick="updateProfile()">Сохранить изменения</button>

            <h3 class="section-title">Смена пароля</h3>
            <div class="form-group">
                <label>Текущий пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="currentPassword">
                    <button type="button" class="toggle-password" onclick="togglePassword('currentPassword', this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 12C4 5 8 3 12 3s8 2 11 9" />
                            <path d="M23 12c-3 7-7 9-11 9s-8-2-11-9" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Новый пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword">
                    <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 12C4 5 8 3 12 3s8 2 11 9" />
                            <path d="M23 12c-3 7-7 9-11 9s-8-2-11-9" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Подтверждение пароля</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword">
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 12C4 5 8 3 12 3s8 2 11 9" />
                            <path d="M23 12c-3 7-7 9-11 9s-8-2-11-9" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>
            <button class="btn-primary" onclick="changePassword()">Сменить пароль</button>
        </div>
    </div>

    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <h3>Выход из аккаунта</h3>
            <p>Вы уверены, что хотите выйти?</p>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeLogoutModal()">Отмена</button>
                <button class="btn-danger" onclick="confirmLogout()">Выйти</button>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/profile.js"></script>
</body>
</html>
