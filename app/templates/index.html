<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎯 Quiz App</h1>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Вход</button>
                <button class="tab" onclick="switchTab('register')">Регистрация</button>
            </div>

            <div id="error" class="error"></div>
            <div id="success" class="success"></div>

            <!-- Форма входа -->
            <form id="loginForm" class="form active" onsubmit="login(event)">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                            <svg viewBox="0 0 24 24">
                                <path d="M1 12C4 5 8 3 12 3s8 2 11 9" />
                                <path d="M23 12c-3 7-7 9-11 9s-8-2-11-9" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit">Войти</button>
                <div class="forgot-link">
                    <a href="/recover">Забыли пароль?</a>
                </div>
            </form>

            <!-- Форма регистрации -->
            <form id="registerForm" class="form" onsubmit="register(event)">
                <div class="input-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="regName" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">
                            <svg viewBox="0 0 24 24">
                                <path d="M1 12C4 5 8 3 12 3s8 2 11 9" />
                                <path d="M23 12c-3 7-7 9-11 9s-8-2-11-9" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label>Роль</label>
                    <select id="regRole">
                        <option value="player">Участник</option>
                        <option value="organizer">Организатор</option>
                    </select>
                </div>
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
