<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="#9b59b6" stroke-width="1.5" fill="none"/>
                <path d="M12 8v4l3 3" stroke="#9b59b6" stroke-width="1.5" fill="none"/>
            </svg>
            Quiz App
        </div>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <button class="icon-btn" onclick="goToHistory()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 8v4l3 3" stroke="#666" stroke-width="1.5" fill="none"/>
                    <circle cx="12" cy="12" r="10" stroke="#666" stroke-width="1.5" fill="none"/>
                    <polyline points="12 8 12 12 15 15" stroke="#666" stroke-width="1.5" fill="none"/>
                </svg>
            </button>
            <button class="icon-btn" onclick="goToLobby()">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H5a2 2 0 0 1-2-2z" stroke="#666" stroke-width="1.5" fill="none"/>
                </svg>
            </button>
            <button class="icon-btn" onclick="showLogoutConfirm()">
                <svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="container game-container">
        <div id="waitingScreen" class="card" style="text-align: center;">
            <div class="waiting-message">
                <h2>⏳ Ожидание начала игры...</h2>
                <p>Код комнаты: <strong id="roomCodeDisplay"></strong></p>
                <p>Организатор скоро начнёт квиз</p>
            </div>
        </div>

        <div id="gameScreen" style="display: none;">
            <div class="timer" id="timer">0</div>
            
            <div class="question-card">
                <div class="question-text" id="questionText"></div>
                <img id="questionImage" class="question-image" style="display: none;">
                <div id="optionsContainer" class="options-list"></div>
                <button id="submitBtn" class="btn-answer" onclick="submitAnswer()">Ответить</button>
            </div>
        </div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h3>🎉 Игра завершена!</h3>
            <div id="finalLeaderboard"></div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="goToLobby()">На главную</button>
            </div>
        </div>
    </div>

    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <h3>Выход из аккаунта</h3>
            <p>Вы уверены, что хотите выйти?</p>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeLogoutModal()">Отмена</button>
                <button class="btn-danger" onclick="confirmLogout()">Выйти</button>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/game.js"></script>
</body>
</html>
